robots:
  cf6:
    cf_name: cf6
    id: 15
    enabled: true
    uri: radio://0/80/2M/E7E7E7E706
    type: default
    initial_position: [0.5, 0.5, 0.0]
    
  cf8:
    cf_name: cf8
    id: 6
    enabled: true
    uri: radio://0/80/2M/E7E7E7E708
    type: default
    initial_position: [0.5, 3.0, 0.0]
        
robot_types:
  default:
    connection: "crazyflie"
    bigQuad: False
    batteryVoltageWarning: 3.8  # V
    batteryVoltageCritical: 3.7 # V
    markerConfiguration: 0 # change to 3 for single marker tracking
    dynamicsConfiguration: 0
    firmware_params:
      commander:
        enHighLevel: 1
      stabilizer:
        estimator: 2 # 1: complementary, 2: kalman
        controller: 1 # 1: PID, 2: mellinger
      ring:
        effect: 7 # 6: double spinner, 7: solid color, 16: packetRate
        solidBlue: 255 # if set to solid color
        solidGreen: 0 # if set to solid color
        solidRed: 0 # if set to solid color
        headlightEnable: 0
      locSrv:
        extPosStdDev: 1e-3
        extQuatStdDev: 0.5e-1
      kalman:
        resetEstimation: 1
    # Firmware Logging for all drones (use robot_types/type_name to set per type, or robots/drone_name to set per drone)
    firmware_logging:
      enabled: true
      default_topics:
        # remove to disable default topic
        pose:
          frequency: 10 # Hz
        status:
          frequency: 1 # Hz
      custom_topics:
        sgp30:
          frequency: 500 # Hz
          vars: ['sgp30.value2L', 'sgp30.value2R']
        battery:
          frequency: 1000 # Hz
          vars: ['pm.state']

# These Marker Configurations are for the real Crazyflies who use Motion Capture System[Vicon or OptiTrack]
numMarkerConfigurations: 4
markerConfigurations:
  "0":  # Standard Crazyflie with 4 markers
    numPoints: 4
    offset: [0.0, -0.01, -0.04]
    points:
      "0": [0.0177184,0.0139654,0.0557585]
      "1": [-0.0262914,0.0509139,0.0402475]
      "2": [-0.0328889,-0.02757,0.0390601]
      "3": [0.0431307,-0.0331216,0.0388839]
  "1": # Medium frame (bigger drone) with 4 markers
    numPoints: 4
    offset: [0.0, 0.0, -0.03]
    points:
      "0": [-0.00896228,-0.000716753,0.0716129]
      "1": [-0.0156318,0.0997402,0.0508162]
      "2": [0.0461693,-0.0881012,0.0380672]
      "3": [-0.0789959,-0.0269793,0.0461144]
  "2": # Big frame (largest drone) with 4 markers
    numPoints: 4
    offset: [0.0, 0.0, -0.06]
    points:
      "0": [0.0558163,-0.00196302,0.0945539]
      "1": [-0.0113941,0.00945842,0.0984811]
      "2": [-0.0306277,0.0514879,0.0520456]
      "3": [0.0535816,-0.0400775,0.0432799]
  "3":  # Standard Crazyflie with just 1 marker
    numPoints: 1
    offset: [0.0, -0.01, -0.04]
    points:
      "0": [0.0177184,0.0139654,0.0557585]
numDynamicsConfigurations: 1
dynamicsConfigurations:
  "0":
    maxXVelocity: 2.0    # Max velocity in X [m/s]
    maxYVelocity: 2.0    # Max velocity in Y [m/s]
    maxZVelocity: 3.0    # Max velocity in Z [m/s]
    maxPitchRate: 20.0   # Max pitch rate [rad/s]
    maxRollRate: 20.0    # Max roll rate [rad/s]
    maxYawRate: 10.0     # Max yaw rate [rad/s]
    maxRoll: 1.4         # Max roll angle [rad] (~80°)
    maxPitch: 1.4        # Max pitch angle [rad] (~80°)
    maxFitnessScore: 0.001  # Matching threshold for marker-to-drone assignment